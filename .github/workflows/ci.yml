name: CI

on:
  pull_request:
  push:
    branches: [main, venue-research]

jobs:
  verify-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Verify offsite write-up exists
        run: |
          test -f offsite-plan.md
          echo "offsite-plan.md is present ✔"
